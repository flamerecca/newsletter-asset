<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
  </defs>
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- 外層：Panel 頁面外殼 -->
  <rect x="30" y="20" width="1140" height="370" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5"/>
  <text x="54" y="64" font-size="20" font-weight="700" fill="#0c4a6e">Panel 頁面外殼，由框架負責</text>

  <!-- 導覽列 -->
  <rect x="54" y="96" width="172" height="270" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="140" y="238" font-size="16" font-weight="700" fill="#0c4a6e" text-anchor="middle">導覽列</text>

  <!-- 版面區 -->
  <rect x="250" y="96" width="896" height="270" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="274" y="128" font-size="16" font-weight="700" fill="#0c4a6e">版面</text>
  <rect x="1022" y="108" width="100" height="28" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1072" y="127" font-size="14" font-weight="700" fill="#0c4a6e" text-anchor="middle">主題樣式</text>

  <!-- 內層：獨立 Livewire 元件 -->
  <rect x="274" y="156" width="520" height="186" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="298" y="196" font-size="20" font-weight="700" fill="#9a3412">獨立 Livewire 元件</text>
  <text x="298" y="222" font-size="14" fill="#475569">不透過 Form，不透過 Schema</text>
  <line x1="298" y1="240" x2="770" y2="240" stroke="#fdba74"/>
  <rect x="298" y="262" width="228" height="56" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="412" y="284" font-size="13" fill="#475569" text-anchor="middle">狀態管理</text>
  <text x="412" y="306" font-size="16" font-family="Menlo,monospace" fill="#9a3412" text-anchor="middle">public $state</text>
  <rect x="542" y="262" width="228" height="56" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="656" y="284" font-size="13" fill="#475569" text-anchor="middle">畫面渲染</text>
  <text x="656" y="306" font-size="16" font-family="Menlo,monospace" fill="#9a3412" text-anchor="middle">render()</text>

  <!-- 邊界說明：外殼 -->
  <line x1="856" y1="213" x2="802" y2="213" stroke="#0284c7" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="868" y="200" font-size="16" font-weight="700" fill="#0c4a6e">Panel 承載並認得它</text>
  <text x="868" y="226" font-size="14" fill="#475569">當成頁面的一部分渲染</text>

  <!-- 邊界說明：元件 -->
  <line x1="856" y1="283" x2="802" y2="283" stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="868" y="270" font-size="16" font-weight="700" fill="#9a3412">內部由你負責</text>
  <text x="868" y="296" font-size="14" fill="#475569">狀態管理與畫面渲染</text>

  <!-- 圖說 -->
  <text x="600" y="440" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">跳出 Schema 這套機制，不等於跳出 Filament</text>

  <!-- 圖例 -->
  <rect x="440" y="466" width="20" height="14" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="470" y="478" font-size="14" fill="#475569">框架負責</text>
  <rect x="620" y="466" width="20" height="14" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="650" y="478" font-size="14" fill="#475569">你負責</text>
</svg>
